<!DOCTYPE html>
<html lang="en" data-i18n-doc-title="light.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light results - REST entity set demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top light-results-header">
  <h1 data-i18n="light.heading">Light results</h1>
</header>

<main>
  <div class="panel">
    <div class="query-preview">
      <div class="label" data-i18n="light.entitySet">Entity set</div>
      <pre id="entity-set-reference" data-i18n="common.loading">Loading…</pre>
    </div>

    <div id="state-loading" class="state-loading" data-i18n="common.requesting">Requesting results…</div>
    <div id="error-panel" class="error-panel" hidden>
      <div class="error-title" data-i18n="common.restFailed">The REST request failed</div>
      <div class="error-item" id="error-message"></div>
    </div>
    <div id="results-container" hidden></div>
  </div>
</main>

<script src="i18n.js"></script>
<script src="lightResults.js"></script>
</body>
</html>
