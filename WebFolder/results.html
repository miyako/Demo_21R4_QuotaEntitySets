<!DOCTYPE html>
<html lang="en" data-i18n-doc-title="results.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search results - REST entity set demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top results-header">
  <h1 data-i18n="results.heading">Search results</h1>
</header>

<main>
  <div class="info-bar" id="info-bar" hidden>
    <div class="stat">
      <span class="k" data-i18n="results.fetched">Current fetched results</span>
      <span class="v" id="result-count">-</span>
    </div>
    <div class="stat">
      <span class="k" data-i18n="results.entitySetId">Entity set ID</span>
      <span class="v" id="entity-set">-</span>
    </div>
  </div>

  <div class="panel">
    <div class="results-panel-actions">
      <button id="light-view-button" class="primary" type="button" data-i18n="results.lightView">Light view</button>
    </div>

    <div class="query-preview">
      <div class="label" data-i18n="results.queryLabel">REST query</div>
      <pre id="query-preview" data-i18n="common.loading">Loading…</pre>
    </div>

    <div id="state-loading" class="state-loading" data-i18n="common.requesting">Requesting results…</div>
    <div id="error-panel" class="error-panel" hidden>
      <div class="error-title" data-i18n="common.restFailed">The REST request failed</div>
      <div class="error-item" id="error-message"></div>
    </div>
    <div id="results-container" hidden></div>
    <div id="load-more-status" class="state-loading" data-i18n="results.loadingMore" hidden>Loading more results…</div>
    <div id="load-more-sentinel" class="load-more-sentinel" hidden></div>
    <pre id="raw-response" class="query-preview" hidden></pre>
  </div>
</main>

<script src="i18n.js"></script>
<script src="results.js"></script>
</body>
</html>
