<!DOCTYPE html>
<html lang="en" data-i18n-doc-title="search.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees search — REST entity set demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top search-header">
  <h1 data-i18n="search.heading">Employees search</h1>
</header>

<main>
  <div class="panel">
    <form id="search-form">

      <div class="field-row">
        <div class="field">
          <label for="firstname" data-i18n="search.firstname">First name</label>
          <input type="text" id="firstname" placeholder="e.g. Mary" data-i18n-placeholder="search.firstnamePlaceholder">
        </div>
        <div class="field">
          <label for="lastname" data-i18n="search.lastname">Last name</label>
          <input type="text" id="lastname" placeholder="e.g. Moore" data-i18n-placeholder="search.lastnamePlaceholder">
        </div>
      </div>

      <div class="field">
        <label for="jobTitle" data-i18n="search.jobTitle">Job title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Developer" data-i18n-placeholder="search.jobTitlePlaceholder">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="salaryMin" data-i18n="search.salaryMin">Salary greater than</label>
          <input type="number" id="salaryMin" placeholder="e.g. 40000" data-i18n-placeholder="search.salaryMinPlaceholder">
        </div>
        <div class="field">
          <label for="salaryMax" data-i18n="search.salaryMax">Salary less than</label>
          <input type="number" id="salaryMax" placeholder="e.g. 60000" data-i18n-placeholder="search.salaryMaxPlaceholder">
        </div>
      </div>

      <div class="actions-row search-actions">
        <button type="submit" class="primary" data-i18n="search.run">Run search</button>
        <div class="secondary-actions">
          <button id="clear-memory-button" type="button" class="primary logout-button" data-i18n="search.clearMemory">Clear memory</button>
          <button id="logout-button" type="button" class="primary logout-button" data-i18n="search.logout">Logout</button>
        </div>
      </div>
      <p class="form-error" id="form-error" hidden></p>

      <div class="query-preview">
        <div class="label" data-i18n="search.queryLabel">REST query that will be sent</div>
        <pre id="query-preview" data-i18n="search.queryEmpty">Fill in at least one field to build a query…</pre>
        <p class="hint" data-i18n="search.hint">This creates an entity set in memory on the REST session ($method=entityset). The result opens in a new tab.</p>
      </div>

      <div class="query-preview stored-entity-sets-panel">
        <div class="label" data-i18n="search.entitySetRefs">Entity set references</div>
        <ul id="entity-set-list" class="entity-set-list"></ul>
      </div>

    </form>
  </div>
</main>

<script src="i18n.js"></script>
<script src="search.js"></script>
</body>
</html>
